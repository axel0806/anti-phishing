# Self-hosted stack: Postgres + API + worker.
#   cp .env.example .env   (fill in SERVER_SECRET, TOKEN_KEY and optionally the Google credentials)
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: anti-phishing

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &env
    DATABASE_URL: postgres://phish:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/phish
    SERVER_SECRET: ${SERVER_SECRET:?set SERVER_SECRET in .env (32+ characters)}
    TOKEN_KEY: ${TOKEN_KEY:?set TOKEN_KEY in .env (64 hex characters)}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    POLL_SECONDS: ${POLL_SECONDS:-60}
    RETENTION_DAYS: ${RETENTION_DAYS:-90}
    # Optional AI layer (off for every user until they enable it). Leave AI_PROVIDER=none to disable it server-wide.
    AI_PROVIDER: ${AI_PROVIDER:-none}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    AI_MODEL: ${AI_MODEL:-}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_PRICE_IN_PER_MTOK: ${AI_PRICE_IN_PER_MTOK:-}
    AI_PRICE_OUT_PER_MTOK: ${AI_PRICE_OUT_PER_MTOK:-}
    AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-2500}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: phish
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phish -d phish"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    environment:
      <<: *env
      ROLE: api
    ports:
      # Bound to localhost only. Put a TLS reverse proxy in front before exposing it: the extension requires HTTPS off localhost.
      - "127.0.0.1:${PORT:-8080}:8080"

  worker:
    <<: *app
    environment:
      <<: *env
      ROLE: worker

volumes:
  pgdata:
