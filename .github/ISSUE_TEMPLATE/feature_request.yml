name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you have in mind?
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - label: Yes, I would like to work on this
